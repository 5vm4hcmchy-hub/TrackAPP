<!DOCTYPE html>

<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" >
    <title>TrackAPP</title>
</head>




<body>

<button id="start">Start</button>

<p>Speed <span id="speed">--</span>km/h</p>
<p>Accuracy <span id="accuracy">--</span>m</p>
<p>Fixes <span id="fixes">--</span></p>
<p>Updates <span id="lastUpdate">--</span></p>

<p>Error<span id="error">-----</span></p>

<script>

    let watchId = null
    const startButton = document.getElementById('start');

    console.log(startButton);

    function handleStart(){
        console.log('watchId:', onSuccess);
    }

    function onSuccess(position){
        console.log('fix recieved')
    }

    function onError(error){
        console.log('GPS error')
    }



    startButton.addEventListener('click', handleStart);


    watchId = navigator.geolocation.watchPosition(onSuccess, onError, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 10000
    });



</script>
</body>


</html>
