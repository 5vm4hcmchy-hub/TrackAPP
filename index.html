<!DOCTYPE html>

<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrackAPP</title>
</head>




<body>

    <button id="start">Start</button>

    <p>Speed <span id="speedDisplay">--</span>km/h</p>
    <p>Accuracy <span id="accuracyDisplay">--</span>m</p>
    <p>Fixes <span id="fixDisplay">--</span></p>
    <p>Updates <span id="lastUpdateDisplay">--</span></p>

    <p>Error<span id="errorDisplay">-----</span></p>

    <script>

        let watchId = null;
        const startButton = document.getElementById('start');

        console.log(startButton);

        function handleStart() {

            watchId = navigator.geolocation.watchPosition(onSuccess, onError, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            });
            console.log('watchId:', watchId);
        }

        function onSuccess(position) {
            console.log(position)
            console.log('speed: ', position.cords.speed)
            console.log('accuracy: ', position.cords.accuracy)
            document.getElementById('speedDisplay').textContent = position.cords.speed
            document.getElementById('accuracyDisplay').textContent = position.cords.accuracy
        }

        function onError(error) {
            console.log('GPS error')
        }

        startButton.addEventListener('click', handleStart);

    </script>
</body>


</html>
