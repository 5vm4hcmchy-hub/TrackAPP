<!DOCTYPE html>

<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" >
    <title>TrackAPP</title>
</head>




<body>

<button id="start">Start</button>

<p>Speed <span id="speed">--</span>km/h</p>
<p>Accuracy <span id="accuracy">--</span>m</p>
<p>Fixes <span id="fixes">--</span></p>
<p>Updates <span id="lastUpdate">--</span></p>

<p>Error<span id="error">-----</span></p>

<script>
    document.getElementById('speed').textContent=9

    const startButton = document.getElementById('start');
    console.log(startButton);

    function handleStart(){
        console.log('buttonClicked');
        document.getElementById('error').textContent= " No Error"
    }

    startButton.addEventListener('click', handleStart);



</script>
</body>


</html>
